name: Mirror to GitLab

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 1. GitHub Secret에 등록된 개인키 주입
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      # 2. mkdir/keyscan 없이 SSH 호스트 검증 우회 + Pure SSH로 미러 푸시
      - name: Push to GitLab via Pure SSH
        env:
          # 15초마다 KeepAlive 패킷을 쏴서 Broken pipe(세션 끊김) 완벽 차단
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
        run: |
          # 1. 26개 락 검증 반복 및 딜레이 즉시 제거
          git config --global lfs.locksverify false
          git config lfs.allowincompletepush true

          # 2. 모든 LFS 히스토리 다운로드
          git lfs fetch --all

          # 3. LFS Pure SSH 모드 및 전송 타임아웃/버퍼 설정
          git config lfs.transfer.mode pure-ssh
          git config lfs.concurrenttransfers 1
          git config lfs.activitytimeout 120

          # 4. GitLab 원격지 등록 및 푸시
          git remote add gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git || git remote set-url gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git
          git push --mirror gitlab
