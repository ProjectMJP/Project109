name: Mirror to GitLab

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Actions 탭에서 수동 실행 가능하도록 지원

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 1. SSH 키 등록
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}

      # 2. 증분 변경 사항만 GitLab으로 미러 푸시
      - name: Push incremental changes to GitLab
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
        run: |
          # 1. 러너 로컬에 없는 과거 LFS 오브젝트 검증 건너뛰기
          # (GitLab 서버에 이미 초기 에셋이 존재하므로 안전하게 통과됨)
          git config lfs.allowincompletepush true

          # 2. Pure SSH 전송 및 병렬 업로드 설정
          git config lfs.transfer.mode pure-ssh
          git config lfs.concurrenttransfers 4

          # 3. GitLab 원격지 설정 및 미러 푸시
          git remote add gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git || git remote set-url gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git
          git push --mirror gitlab
