name: Mirror to GitLab

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Actions 탭에서 수동 실행 가능하도록 지원

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 1. SSH 키 등록
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      # 2. 증분 변경 사항만 GitLab으로 미러 푸시
      - name: Push incremental changes to GitLab
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
        run: |
          # 1. LFS 설정
          git config lfs.allowincompletepush true
          git config lfs.transfer.mode pure-ssh
          git config lfs.concurrenttransfers 4

          # 2. 원격지 등록
          git remote add gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git || git remote set-url gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git

          # 3. 현재 main 브랜치 및 태그 푸시
          git push gitlab HEAD:refs/heads/main --tags

          # 4. GitHub의 모든 원격 브랜치를 GitLab 브랜치로 안전하게 동기화 (숨김 참조 방지)
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v '^HEAD$' | while read branch; do
            git push gitlab "refs/remotes/origin/$branch:refs/heads/$branch" --force
          done
