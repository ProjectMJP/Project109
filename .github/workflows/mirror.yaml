name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with Git LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # LFS 실제 바이너리 파일까지 다운로드

      - name: Configure Git LFS & Push to GitLab
        run: |
          # 1. 누락된 LFS 오브젝트가 있어도 푸시를 허용하도록 설정
          git config --global lfs.allowincompletepush true
          
          # 2. 자체 호스팅 서버 URL 리다이렉트 및 슬래시 이슈 방지 (.git/ 경로 정규화)
          git push --mirror https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab-siryu.com/SIRYU/Project109.git
