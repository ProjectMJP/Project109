name: Mirror to GitLab

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 1. GitHub Secret에 등록된 개인키 주입
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      # 2. mkdir/keyscan 없이 SSH 호스트 검증 우회 + Pure SSH로 미러 푸시
      - name: Push to GitLab via Pure SSH
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          # 1. 누락된 과거 LFS 오브젝트가 있어도 푸시 허용 (핵심)
          git config lfs.allowincompletepush true

          # 2. GitHub에 보관된 모든 브랜치/히스토리의 LFS 바이너리 내려받기
          git lfs fetch --all

          # 3. LFS Pure SSH 모드 및 직결 전송 설정
          git config lfs.transfer.mode pure-ssh
          git config lfs.concurrenttransfers 1

          # 4. 원격지 설정 및 미러 푸시
          git remote add gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git || git remote set-url gitlab git@ssh.gitlab-siryu.com:SIRYU/Project109.git
          git push --mirror gitlab
