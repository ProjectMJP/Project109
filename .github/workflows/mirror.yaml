name: Mirror to GitLab

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      - name: Add Known Hosts & Push via SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gitlab-siryu.com >> ~/.ssh/known_hosts

          # LFS가 Cloudflare HTTP(413 에러)를 거치지 않고 SSH를 타도록 강제
          git config lfs.transfer.mode pure-ssh
          git config lfs.concurrenttransfers 1

          git remote add gitlab git@gitlab-siryu.com:SIRYU/Project109.git
          git push --mirror gitlab
