# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
choice: &choice_data
  type: object
  properties:
    description:
      type: string
    nextStageID:
      type: string
    luaScript:
      type: string

condition: &appear_condition
  type: object
  conditionType:
    type: string
    enum:
    - None
    - CurrentHp
    - CurrentMoney
    - Playtime
  value:
    type: integer

type: object
properties:
  eventCollection:
    type: array
    items:
      type: object
      properties:
        eventID:
          type: string
          eventAppearLevel:
            type: integer
            description: "0: 어디서든 발견할 수 있는 특정 이벤트,
                          1~3: 해당 스테이지에서 발견할 수 있는 이벤트,
                          4: 랜덤으로 발견할 수 없는 특정 이벤트"           
            minimum: !!int 0
            maximum: !!int 4
          eventAppearCondition:
            type: array
            item:
              <<: *appear_condition
          eventObjectPath:
            type: string
          stages:
            type: array
            items:
              type: object
              properties:
                stageID:
                  type: string
                stageDescription:
                  type: string
                choices:
                  type: array
                  item:
                    <<: *choice_data
            required:
              - stageDescription 
              - choices
      required:
        - eventID
        - eventAppearLevel
        - eventAppearCondition
        - eventObjectPath
        - stages
required:
  - eventCollection